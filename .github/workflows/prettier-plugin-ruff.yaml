concurrency:
  cancel-in-progress: true
  group: prettier-plugin-ruff
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bash script/prettier-plugin-ruff.sh job__build step__build
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash script/prettier-plugin-ruff.sh job__build step__release
      - run: bash script/prettier-plugin-ruff.sh job__build step__stage
    timeout-minutes: 10
name: prettier-plugin-ruff
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prettier-plugin-ruff.yaml
      - script/prettier-plugin-ruff.sh
      - source/prettier-plugin-ruff/**
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
